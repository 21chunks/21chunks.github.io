<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 Chunks - Refining Kid Potential!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFD93D;
            --secondary: #6BCB77;
            --accent: #4D96FF;g
            --highlight: #FF6B6B;
            --dark: #2B2B2B;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f7ff;
            overflow-x: hidden;
            color: var(--dark);
            scroll-behavior: smooth;
        }

        h1, h2, h3 {
            font-family: 'Fredoka One', cursive;
        }

        .chunk-card {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border-bottom: 8px solid rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chunk-card:hover {
            transform: translateY(-10px) rotate(1deg);
            border-bottom-width: 12px;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translate(0, 0px); }
            50% { transform: translate(0, 15px); }
            100% { transform: translate(0, -0px); }
        }

        .bg-pattern {
            background-color: #f0f7ff;
            background-image: radial-gradient(#4D96FF 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .btn-pop {
            transition: transform 0.1s active;
            box-shadow: 0 6px 0 #b28e00;
        }

        .btn-pop:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b28e00;
        }

        #game-canvas {
            background: white;
            border: 4px solid var(--accent);
            border-radius: 24px;
            cursor: crosshair;
            touch-action: none;
        }

        .event-tag {
            @apply px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider;
        }

        .hidden { display: none; }
    </style>
</head>
<body class="bg-pattern min-h-screen">

    <!-- Navigation -->
    <nav class="p-6 flex justify-between items-center max-w-6xl mx-auto relative z-50">
        <div class="flex items-center gap-3 cursor-pointer" onclick="showView('home')">
            <div class="w-12 h-12 bg-yellow-400 rounded-xl rotate-12 flex items-center justify-center text-white text-2xl font-bold shadow-lg">21</div>
            <span class="text-2xl font-bold tracking-tight text-blue-600">CHUNKS</span>
        </div>
    </nav>

    <!-- Events View -->
    <main id="events-view" class="py-12">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex items-center gap-4 mb-12">
                <h1 class="text-5xl text-blue-900">Hosting a School Event?</h1>
            </div>
            
            <div class="mt-20 text-center bg-blue-50 p-12 rounded-[40px]">
		<div class="calendly-inline-widget" data-url="https://calendly.com/21chunks/puppet-show" style="min-width:320px;height:700px;"></div>
		<script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
            </div>
        </div>
    </main>

    <!-- Shared Footer -->
    <footer class="pb-12 pt-12 text-center text-blue-400 font-bold border-t border-blue-100 mt-12 bg-white">
        <div class="flex justify-center gap-6 mb-4">
            <span class="hover:text-blue-600 cursor-pointer">Facebook</span>
            <span class="hover:text-blue-600 cursor-pointer">LinkedIn</span>
            <span class="hover:text-blue-600 cursor-pointer">Instagram</span>
        </div>
        <p>© 2024 21 Chunks (Pty) Ltd - Refining Potential, One Event at a Time.</p>
    </footer>

    <script>
        // View Navigation Logic
        function showView(viewId) {
            const home = document.getElementById('home-view');
            const events = document.getElementById('events-view');
            
            if (viewId === 'home') {
                home.classList.remove('hidden');
                events.classList.add('hidden');
                window.scrollTo(0, 0);
            } else {
                home.classList.add('hidden');
                events.classList.remove('hidden');
                window.scrollTo(0, 0);
            }
        }

        function scrollToId(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        // Game Logic
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('game-overlay');
        const scoreEl = document.getElementById('game-score');
        const timerEl = document.getElementById('game-timer');

        let score = 0;
        let timeLeft = 30;
        let isPlaying = false;
        let chunks = [];
        let animationId;

        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Chunk {
            constructor() {
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -50;
                this.size = Math.random() * 40 + 30;
                this.speed = Math.random() * 2 + 2;
                this.color = ['#FFD93D', '#6BCB77', '#4D96FF', '#FF6B6B'][Math.floor(Math.random() * 4)];
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
                this.type = Math.random() > 0.8 ? 'bonus' : 'normal';
            }
            update() {
                this.y += this.speed;
                this.rotation += this.rotSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.roundRect(-this.size/2, -this.size/2, this.size, this.size, 12);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath();
                ctx.arc(-this.size/4, -this.size/8, this.size/10, 0, Math.PI*2);
                ctx.arc(this.size/4, -this.size/8, this.size/10, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isPlaying && Math.random() < 0.04) chunks.push(new Chunk());
            for (let i = chunks.length - 1; i >= 0; i--) {
                chunks[i].update();
                chunks[i].draw();
                if (chunks[i].y > canvas.height + 50) chunks.splice(i, 1);
            }
            if (isPlaying) animationId = requestAnimationFrame(updateGame);
        }

        function startGame() {
            isPlaying = true;
            score = 0;
            timeLeft = 30;
            chunks = [];
            scoreEl.textContent = score;
            timerEl.textContent = timeLeft;
            overlay.style.display = 'none';
            const timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    isPlaying = false;
                    cancelAnimationFrame(animationId);
                    overlay.style.display = 'flex';
                    startBtn.innerHTML = `Nice! Score: ${score}<br>Play Again?`;
                }
            }, 1000);
            updateGame();
        }

        function handleClick(e) {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            for (let i = chunks.length - 1; i >= 0; i--) {
                const c = chunks[i];
                if (Math.hypot(c.x - x, c.y - y) < c.size) {
                    score += c.type === 'bonus' ? 50 : 10;
                    chunks.splice(i, 1);
                    scoreEl.textContent = score;
                    return;
                }
            }
        }

        canvas.addEventListener('mousedown', handleClick);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); });
        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
